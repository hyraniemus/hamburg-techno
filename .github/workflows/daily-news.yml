name: Daily AI News Summary

# Runs daily at 06:30 CEST (04:30 UTC in summer, 05:30 UTC in winter)
# GitHub Actions uses UTC, so we use 04:30 UTC which is 06:30 CEST
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/happy-maxwell-g01jt9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate daily news summary
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_RECIPIENT: 'mmittelbach@gmail.com'
        run: |
          npx ts-node scripts/daily-news.ts

      - name: Commit and push if changes
        run: |
          git config user.name "News Bot"
          git config user.email "bot@hamburg-techno.local"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily news summary" && git push)
        continue-on-error: true
