name: Daily AI Post-Prod News Summary

on:
  schedule:
    # 06:30 CEST = 04:30 UTC (CET) or 05:30 UTC (CEST)
    - cron: '30 5 * * *'  # CEST (UTC+2, Summer time June)
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil

      - name: Generate daily news summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/generate_news_summary.py

      - name: Commit and push if changed
        run: |
          git config user.name "News Bot"
          git config user.email "noreply@hamburg-techno.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily AI Post-Prod News Summary - $(date -u +%Y-%m-%d)"
            git push origin ${{ github.ref }}
          fi
