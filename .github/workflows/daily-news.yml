name: 📰 Tägliche AI-Post-Prod News

on:
  schedule:
    # 06:30 CEST = 04:30 UTC (wegen Sommerzeit)
    # Frühling/Sommer: CEST (UTC+2)
    # Herbst/Winter: CET (UTC+1)
    - cron: '30 4 * * *'  # 06:30 CEST
  workflow_dispatch:  # Manuell auslösbar

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python installieren
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Dependencies installieren
        run: |
          pip install requests python-dotenv

      - name: 🔄 Zeitzone auf CEST setzen
        run: |
          sudo timedatectl set-timezone Europe/Berlin

      - name: 📰 News-Zusammenfassung generieren
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python scripts/daily_news_summary.py

      - name: 💾 Änderungen committen (falls vorhanden)
        run: |
          git config user.name "News Bot"
          git config user.email "bot@hamburg-techno.local"
          git add -A
          if git diff --cached --quiet; then
            echo "✅ Keine Änderungen"
          else
            git commit -m "📰 Daily AI-Post-Prod News - $(date +%Y-%m-%d)"
            git push origin claude/happy-maxwell-BIAKC || echo "Push skipped (keine Berechtigung)"
          fi

      - name: 📧 Discord Notification (optional)
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '📰 AI-Post-Prod News für ${{ github.event.schedule }} erstellt'
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
        continue-on-error: true
