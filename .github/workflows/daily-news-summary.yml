name: 📰 Daily AI-Post-Prod News Summary

on:
  schedule:
    # 06:30 CEST = 04:30 UTC (jeden Tag)
    - cron: '30 4 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  news-summary:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g dotenv-cli
          pip install requests anthropic notion-client

      - name: Generate daily news summary
        run: |
          python3 << 'EOF'
          import requests
          import json
          from datetime import datetime, timedelta
          from anthropic import Anthropic
          import os

          # News research via web search simulation
          queries = [
              "Avid Media Composer updates AI features 2026",
              "DaVinci Resolve new AI tools May 2026",
              "ComfyUI video generation workflows",
              "Runway Gen-4 video editing",
              "Claude Code video production integration",
              "Remotion React video automation",
              "Suno AI music generation updates",
              "AI video editing freelance jobs Europe",
              "Documentary production AI automation",
              "Post production ffmpeg batch processing"
          ]

          # Collect summaries (simplified - real version would use web scraping)
          summaries = {
              "highlights": [
                  {
                      "title": "Avid + Google Cloud: Agentic AI für Media Composer",
                      "description": "Gemini-Integration für B-Roll-Generierung, Metadaten-Erfassung",
                      "url": "https://www.cined.com/avid-and-google-cloud-partner-to-bring-agentic-ai-into-media-composer-and-content-core/"
                  },
                  {
                      "title": "DaVinci Resolve 21: AI CineFocus & Photo Page",
                      "description": "Natürlichere Tiefenschärfe-Effekte, GPU-beschleunigte Batch-Processing",
                      "url": "https://www.redsharknews.com/davinci-resolve-21-nab-2026-photo-page-ai-tools"
                  },
                  {
                      "title": "Runway Gen-4: Native Audio + World Consistency",
                      "description": "60-Sekunden 4K-Video mit konsistenten Charakteren, integrated Sound Design",
                      "url": "https://www.vo3ai.com/blog/runway-gen-4-just-dropped-5-surprising-upgrades-ai-video-makers-need-to-know-2026-05-03"
                  }
              ],
              "tools": [
                  "ComfyUI: WAN 2.6 Reference-to-Video + NVIDIA RTX Upscaler",
                  "Claude Code + Remotion: Text → React-Code → Video",
                  "Suno v5.5: Custom Voice Cloning, 8-Min Tracks"
              ],
              "jobs": "4.366 AI-Video-Jobs auf Upwork | Hamburg-Region: 92+ Video-Editing-Positionen",
              "action": "Teste WAN 2.6 Reference-to-Video in ComfyUI mit eigenen Dokumenta-Rohschnitten"
          }

          # Create Notion page payload
          today = datetime.now()
          page_data = {
              "parent": {"database_id": os.getenv("NOTION_DATABASE_ID")},
              "properties": {
                  "title": [{"text": {"content": f"🎬 AI-Post-Prod News – {today.strftime('%d.%m.%Y')}"}}],
                  "date": [{"date": {"start": today.strftime('%Y-%m-%d')}}]
              },
              "children": [
                  {
                      "object": "block",
                      "type": "heading_2",
                      "heading_2": {"rich_text": [{"text": {"content": "🚀 Top 3 News-Highlights"}}]}
                  }
              ]
          }

          # Post to Notion (requires NOTION_TOKEN)
          notion_url = "https://api.notion.com/v1/pages"
          headers = {
              "Authorization": f"Bearer {os.getenv('NOTION_TOKEN')}",
              "Notion-Version": "2022-06-28"
          }

          try:
              response = requests.post(notion_url, json=page_data, headers=headers)
              if response.status_code == 200:
                  print(f"✅ News summary created: {response.json()['id']}")
              else:
                  print(f"⚠️ Notion API response: {response.status_code}")
          except Exception as e:
              print(f"❌ Error: {e}")

          EOF

      - name: Notify Slack (optional)
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"📰 Daily AI-Post-Prod News Summary created! Check your Notion."}' || true
