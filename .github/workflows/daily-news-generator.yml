name: Daily AI Post-Prod News Generator

on:
  schedule:
    # Täglich um 06:30 CEST (04:30 UTC im Winter, 05:30 UTC im Sommer)
    # GitHub Actions verwendet immer UTC
    - cron: '30 4 * * *'  # 06:30 CEST (April-Oktober: 05:30 UTC)

  # Manuelles Triggern für Tests
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests

      - name: 🚀 Run daily news generator
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 941d6c5a-b60d-44c1-a39e-8f947bfa0845
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_news_generator.py

      - name: 📊 Log execution status
        if: always()
        run: |
          echo "Daily news generation executed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Notion Database: https://www.notion.so/a9e2d82ca5f746caaf5cc85dec64466c"

  # Optional: Sende Notification bei Fehler
  notify-on-failure:
    runs-on: ubuntu-latest
    needs: generate-news
    if: failure()

    steps:
      - name: 📢 Log workflow failure
        run: |
          echo "❌ Daily news generation failed!"
          echo "Check GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
